name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          PAGES: "true"
      # The doctrine gates, as one step: `pnpm check` is the same command a
      # contributor runs locally, so CI and a laptop cannot disagree.
      - run: pnpm check
      - run: pnpm -r lint && pnpm lint:md && pnpm lint:prose && pnpm format:check
      - run: pnpm -r exec tsc --noEmit
      - run: pnpm --filter @loamui/core audit:contrast
      - run: pnpm -r test && pnpm --filter @loamui/core test:package
      - run: pnpm --filter @loamui/core exec playwright install --with-deps chromium firefox webkit
      # Every story rendered in Chromium, its play function run, axe applied.
      - run: pnpm --filter @loamui/core test:stories
      - run: pnpm --filter @loamui/core test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            packages/core/test-results
            packages/core/playwright-report
