name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
        env:
          PAGES: "true"
      - run: pnpm check:skill
      - run: pnpm check:prompts
      - run: pnpm check:strings
      - run: pnpm test:checks
      - run: pnpm check:scope
      - run: pnpm check:spacing
      - run: pnpm check:anatomy
      - run: pnpm check:recipes
      - run: pnpm -r lint
      - run: pnpm lint:md
      - run: pnpm lint:prose
      - run: pnpm format:check
      - run: pnpm --filter @loamui/core exec tsc --noEmit
      - run: npx tsc --noEmit
        working-directory: apps/docs
      - run: pnpm --filter @loamui/core audit:contrast
      - run: pnpm --filter @loamui/core test
      - run: pnpm --filter @loamui/core test:package
      - run: pnpm --filter @loamui/docs test
      - run: pnpm --filter @loamui/core exec playwright install --with-deps chromium firefox webkit
      - run: pnpm --filter @loamui/core test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: |
            packages/core/test-results
            packages/core/playwright-report
