name: Release loamui
on:
  push:
    tags: ["loamui-v*"]
permissions:
  contents: read
concurrency:
  group: release-loamui-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${RELEASE_TAG#loamui-v}"
          PKG_VERSION="$(node -p "require('./packages/cli/package.json').version")"
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tags must use loamui-vMAJOR.MINOR.PATCH. Prereleases need a separate npm dist-tag."
            exit 1
          fi
          echo "PKG_VERSION=$PKG_VERSION" >> "$GITHUB_ENV"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag loamui-v$TAG_VERSION does not match loamui version $PKG_VERSION — bump the package version before tagging."
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter loamui test
      - run: npm pack --dry-run
        working-directory: packages/cli
      # A tag can be pushed again, or created after a manual publish: skip the
      # publish when the version is already on the registry, then release as usual.
      - id: registry
        env:
          PKG_VERSION: ${{ env.PKG_VERSION }}
        run: |
          if npm view "loamui@$PKG_VERSION" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "loamui@$PKG_VERSION is already on npm; skipping publish."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.published != 'true'
        run: npm publish --access public --provenance
        working-directory: packages/cli
      - name: Create the GitHub Release from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
          PKG_VERSION: ${{ env.PKG_VERSION }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            const [, version, file] = process.argv;
            const md = fs.readFileSync(file, "utf8");
            const start = md.indexOf(`## ${version}`);
            if (start === -1) { console.error(`No "## ${version}" section in ${file}`); process.exit(1); }
            const rest = md.slice(md.indexOf("\n", start) + 1);
            const end = rest.search(/^## /m);
            fs.writeFileSync("release-notes.md", (end === -1 ? rest : rest.slice(0, end)).trim() + "\n");
          ' "$PKG_VERSION" packages/cli/CHANGELOG.md
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "loamui $PKG_VERSION" --notes-file release-notes.md
